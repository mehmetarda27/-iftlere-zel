<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senin İçin</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  height:100vh;
  overflow:hidden;
  background:#050205;
  font-family:sans-serif;
  color:white;
}

/* PARÇACIK ARKA PLAN */
canvas{
  position:fixed;
  inset:0;
  z-index:0;
}

/* SAHNE */
.scene{
  position:relative;
  z-index:2;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

/* GÜL */
.rose{
  width:160px;
  height:160px;
  border-radius:50%;
  background:radial-gradient(circle,#ff3d7f,#6a0025);
  box-shadow:0 0 80px rgba(255,60,130,.8);
  animation:roseFloat 4s ease-in-out infinite;
  margin-bottom:40px;
}

@keyframes roseFloat{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-20px) scale(1.05)}
}

/* YAZILAR */
.text{
  opacity:0;
  transform:translateY(30px);
  animation:fade 1.5s forwards;
}

.text:nth-child(2){animation-delay:1s}
.text:nth-child(3){animation-delay:3s}
.text:nth-child(4){animation-delay:5s}

@keyframes fade{
  to{opacity:1;transform:translateY(0)}
}

.big{
  font-size:32px;
  font-weight:900;
  color:#ff6fa8;
}

.mid{
  font-size:20px;
  color:#ffdce8;
  margin-top:12px;
}

.small{
  margin-top:20px;
  font-size:16px;
  color:#ffbcd3;
}

/* BUTON */
.btn{
  margin-top:40px;
  padding:15px 30px;
  border-radius:999px;
  background:linear-gradient(135deg,#ff4f93,#ffd1dc);
  color:#190713;
  text-decoration:none;
  font-weight:900;
  opacity:0;
  animation:fade 2s forwards;
  animation-delay:7s;
}

/* VIGNETTE */
.overlay{
  position:fixed;
  inset:0;
  background:radial-gradient(circle,transparent 40%,#000 100%);
  z-index:1;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>
<div class="overlay"></div>

<div class="scene">

  <div class="rose"></div>

  <div class="text big">Saide için</div>
  <div class="text mid">Sen hayatıma gelen en güzel şeysin</div>
  <div class="text small">İyi ki varsın iyi ki benimlesin</div>

  <a class="btn" href="https://wa.me/905XXXXXXXXX">
    Bana da yap
  </a>

</div>

<script>
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

let particles=[];

for(let i=0;i<120;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*2,
    v:Math.random()*0.5+0.2
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="rgba(255,255,255,0.8)";
  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();

    p.y+=p.v;
    if(p.y>canvas.height){
      p.y=0;
      p.x=Math.random()*canvas.width;
    }
  });

  requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
