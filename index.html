<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senin İçin Kodladım</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  width:100%;
  height:100vh;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#020006;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

.overlay{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at center,transparent 35%,rgba(0,0,0,.75) 100%),
    linear-gradient(to top,rgba(0,0,0,.78),transparent 45%,rgba(0,0,0,.55));
  z-index:2;
  pointer-events:none;
}

.brand{
  position:fixed;
  top:28px;
  left:50%;
  transform:translateX(-50%);
  z-index:5;
  color:#ff9df0;
  font-size:24px;
  font-weight:900;
  letter-spacing:5px;
  text-shadow:0 0 25px #ff42d0;
}

.card{
  position:fixed;
  bottom:42px;
  left:50%;
  transform:translateX(-50%);
  z-index:5;
  width:90%;
  max-width:720px;
  padding:26px 22px;
  border-radius:30px;
  text-align:center;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(18px);
  box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.card h1{
  color:white;
  font-size:42px;
  line-height:1.12;
  margin-bottom:10px;
}

.card h1 span{
  color:#ff7ee7;
  text-shadow:0 0 22px #ff3ad4;
}

.card p{
  color:#ffe8fb;
  font-size:18px;
  line-height:1.6;
}

.btn{
  margin-top:18px;
  display:inline-block;
  padding:14px 28px;
  border-radius:999px;
  background:linear-gradient(135deg,#ff3ad4,#ffd1f5);
  color:#1b0618;
  font-weight:900;
  text-decoration:none;
  box-shadow:0 15px 45px rgba(255,58,212,.35);
}

@media(max-width:600px){
  .brand{font-size:18px;letter-spacing:3px}
  .card{bottom:32px;padding:22px 18px}
  .card h1{font-size:31px}
  .card p{font-size:15px}
}
</style>
</head>

<body>

<canvas id="scene"></canvas>
<div class="overlay"></div>

<div class="brand">LOVE CODE</div>

<div class="card">
  <h1>Herkes çiçek alır<br><span>ben senin için kodlarım</span></h1>
  <p>QR okutulduğunda açılan kişiye özel animasyonlu dijital hediye deneyimi</p>
  <a class="btn" href="https://wa.me/905XXXXXXXXX">Bana Özel Tasarla</a>
</div>

<script>
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");

let W,H,dpr;
let isMobile = window.innerWidth < 700;

function resize(){
  isMobile = window.innerWidth < 700;
  dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 1.15 : 1.5);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
window.addEventListener("resize",()=>{resize(); setupFlowers();});

const mouse = {x: W/2, y: H/2};
window.addEventListener("mousemove", e=>{
  mouse.x=e.clientX;
  mouse.y=e.clientY;
});

let stars=[];
let fallingPetals=[];

function setupStars(){
  stars=[];
  const starCount = isMobile ? 70 : 110;
  for(let i=0;i<starCount;i++){
    stars.push({
      x:Math.random()*W,
      y:Math.random()*H,
      r:Math.random()*1.4+.35,
      a:Math.random()*.7+.25,
      s:Math.random()*.22+.06
    });
  }
}
setupStars();

class Flower{
  constructor(x, base, scale, hue, delay, heightBoost){
    this.x=x;
    this.base=base;
    this.scale=scale;
    this.hue=hue;
    this.delay=delay;
    this.t=0;
    this.growth=0;
    this.bloom=0;
    this.height=(230+heightBoost)*scale;
    this.maxBloom=(34+Math.random()*10)*scale;
    this.phase=Math.random()*Math.PI*2;
    this.petalRotation=Math.random()*Math.PI;
  }

  update(){
    this.t++;
    if(this.t < this.delay) return;

    if(this.growth < 1){
      this.growth += isMobile ? .016 : .013;
    }else if(this.bloom < 1){
      this.bloom += isMobile ? .024 : .019;
    }

    if(this.bloom > .85 && fallingPetals.length < 45 && Math.random() < (isMobile ? .008 : .014)){
      fallingPetals.push({
        x:this.x + (Math.random()-.5)*45*this.scale,
        y:this.base - this.height + (Math.random()-.5)*12,
        vx:(Math.random()-.5)*.9,
        vy:Math.random()*.8+.35,
        r:Math.random()*3.5+2.4,
        hue:this.hue,
        rot:Math.random()*Math.PI
      });
    }

    this.draw();
  }

  draw(){
    if(this.t < this.delay) return;

    const ease = 1 - Math.pow(1-this.growth,3);
    const stemH = this.height * ease;
    const topX = this.x + Math.sin(Date.now()/1000 + this.phase)*9*this.scale;
    const topY = this.base - stemH;

    ctx.save();

    ctx.shadowColor = "#8cff6a";
    ctx.shadowBlur = isMobile ? 4 : 8;

    ctx.beginPath();
    ctx.strokeStyle = "#6cff63";
    ctx.lineWidth = 5*this.scale;
    ctx.lineCap = "round";
    ctx.moveTo(this.x,this.base);
    ctx.bezierCurveTo(
      this.x-24*this.scale,this.base-stemH*.35,
      topX+18*this.scale,this.base-stemH*.7,
      topX,topY
    );
    ctx.stroke();

    ctx.shadowBlur=0;

    this.drawLeaf(this.x-10*this.scale,this.base-stemH*.42,-1,this.scale);
    this.drawLeaf(this.x+12*this.scale,this.base-stemH*.62,1,this.scale);

    if(this.growth>.94){
      this.drawBloom(topX,topY,this.maxBloom*this.bloom);
    }

    ctx.restore();
  }

  drawLeaf(x,y,dir,scale){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(dir*.75);
    const grad = ctx.createLinearGradient(-30*scale,0,36*scale,0);
    grad.addColorStop(0,"#48ff55");
    grad.addColorStop(1,"#0b8f35");
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(42*scale,-24*scale,68*scale,0);
    ctx.quadraticCurveTo(38*scale,20*scale,0,0);
    ctx.fill();
    ctx.restore();
  }

  drawBloom(x,y,r){
    if(r<=1)return;

    if(!isMobile){
      const aura = ctx.createRadialGradient(x,y,0,x,y,r*3.4);
      aura.addColorStop(0,`hsla(${this.hue},100%,65%,.34)`);
      aura.addColorStop(.55,`hsla(${this.hue},100%,55%,.08)`);
      aura.addColorStop(1,`hsla(${this.hue},100%,55%,0)`);
      ctx.fillStyle=aura;
      ctx.beginPath();
      ctx.arc(x,y,r*3.4,0,Math.PI*2);
      ctx.fill();
    }

    const layers=[
      {count:14,dist:1.48,size:1.0,rot:.0},
      {count:10,dist:.98,size:.82,rot:.35},
      {count:7,dist:.52,size:.65,rot:.18}
    ];

    layers.forEach(layer=>{
      for(let i=0;i<layer.count;i++){
        const a=(Math.PI*2/layer.count)*i + layer.rot + this.petalRotation;
        const px=x+Math.cos(a)*r*layer.dist;
        const py=y+Math.sin(a)*r*layer.dist;

        ctx.save();
        ctx.translate(px,py);
        ctx.rotate(a+Math.PI/2);

        const grad=ctx.createLinearGradient(0,-r,0,r);
        grad.addColorStop(0,`hsl(${this.hue+45},100%,76%)`);
        grad.addColorStop(.45,`hsl(${this.hue},100%,58%)`);
        grad.addColorStop(1,`hsl(${this.hue-35},100%,44%)`);

        ctx.fillStyle=grad;
        ctx.shadowColor=`hsl(${this.hue},100%,66%)`;
        ctx.shadowBlur=isMobile ? 5 : 11;

        ctx.beginPath();
        ctx.moveTo(0,-r*1.15*layer.size);
        ctx.bezierCurveTo(
          r*.62*layer.size,-r*.68*layer.size,
          r*.62*layer.size,r*.68*layer.size,
          0,r*1.05*layer.size
        );
        ctx.bezierCurveTo(
          -r*.62*layer.size,r*.68*layer.size,
          -r*.62*layer.size,-r*.68*layer.size,
          0,-r*1.15*layer.size
        );
        ctx.fill();
        ctx.restore();
      }
    });

    ctx.save();
    ctx.shadowColor="#ffd86b";
    ctx.shadowBlur=isMobile ? 7 : 14;
    const center=ctx.createRadialGradient(x,y,0,x,y,r*.62);
    center.addColorStop(0,"#ffe58a");
    center.addColorStop(.58,"#8b4a16");
    center.addColorStop(1,"#3a1706");
    ctx.fillStyle=center;
    ctx.beginPath();
    ctx.arc(x,y,r*.6,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

let flowers=[];

function setupFlowers(){
  flowers=[];
  const count = isMobile ? 7 : 9;
  const start = W*.14;
  const end = W*.86;
  const gap = (end-start)/(count-1);

  for(let i=0;i<count;i++){
    const x=start+gap*i;
    const scale=isMobile ? .68 + (i%3)*.05 : .78 + (i%3)*.07;
    const hue=255+(i*23)%85;
    const heightBoost = (i%2===0 ? 80 : 35) + Math.random()*35;
    flowers.push(new Flower(x,H-92,scale,hue,i*18+Math.random()*16,heightBoost));
  }
}
setupFlowers();

function background(){
  const bg=ctx.createRadialGradient(W/2,H*.42,0,W/2,H*.42,H*.9);
  bg.addColorStop(0,"#3b145f");
  bg.addColorStop(.35,"#170722");
  bg.addColorStop(1,"#020006");
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  if(!isMobile){
    const light=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,320);
    light.addColorStop(0,"rgba(255,80,220,.08)");
    light.addColorStop(1,"rgba(255,80,220,0)");
    ctx.fillStyle=light;
    ctx.fillRect(0,0,W,H);
  }
}

function drawStars(){
  ctx.fillStyle="white";
  stars.forEach(s=>{
    ctx.save();
    ctx.globalAlpha=s.a;
    ctx.shadowColor="#fff";
    ctx.shadowBlur=isMobile ? 2 : 5;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
    ctx.restore();

    s.y+=s.s;
    if(s.y>H+5){
      s.y=-5;
      s.x=Math.random()*W;
    }
  });
}

function drawGround(){
  const g=ctx.createRadialGradient(W/2,H-60,20,W/2,H-40,W*.5);
  g.addColorStop(0,"rgba(110,255,95,.14)");
  g.addColorStop(.45,"rgba(255,80,220,.07)");
  g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.ellipse(W/2,H-65,W*.5,62,0,0,Math.PI*2);
  ctx.fill();
}

function drawFallingPetals(){
  for(let i=fallingPetals.length-1;i>=0;i--){
    const p=fallingPetals[i];
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle=`hsla(${p.hue},100%,72%,.82)`;
    ctx.shadowColor=`hsl(${p.hue},100%,70%)`;
    ctx.shadowBlur=isMobile ? 3 : 7;
    ctx.beginPath();
    ctx.ellipse(0,0,p.r,p.r*1.7,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();

    p.x+=p.vx;
    p.y+=p.vy;
    p.rot+=.025;

    if(p.y>H+40) fallingPetals.splice(i,1);
  }
}

let last = 0;
const fps = 45;
const interval = 1000/fps;

function animate(now){
  requestAnimationFrame(animate);

  if(now-last < interval) return;
  last = now;

  ctx.clearRect(0,0,W,H);
  background();
  drawStars();
  drawGround();

  flowers.forEach(f=>f.update());

  drawFallingPetals();
}

requestAnimationFrame(animate);
</script>

</body>
</html>
