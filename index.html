<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Love Scene</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  overflow:hidden;
  background:#020006;
  font-family:sans-serif;
}

canvas{
  position:fixed;
  inset:0;
}

/* yazı */
.text{
  position:fixed;
  bottom:40px;
  width:100%;
  text-align:center;
  color:white;
  font-size:34px;
  font-weight:900;
  z-index:5;
}

.text span{
  color:#ff7ee7;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div class="text">
  Herkes çiçek alır <br>
  ben senin için <span>kodlarım</span>
</div>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");

let W,H;

function resize(){
  W = c.width = window.innerWidth;
  H = c.height = window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

/* yıldızlar OPTİMİZE */
let stars = [];
for(let i=0;i<80;i++){
  stars.push({
    x:Math.random()*W,
    y:Math.random()*H,
    s:Math.random()*1.5
  });
}

/* çiçek */
class Flower{
  constructor(x, delay){
    this.x = x;
    this.delay = delay;
    this.t = 0;
    this.h = 0;
    this.maxH = 220 + Math.random()*60;
    this.bloom = 0;
    this.size = 20 + Math.random()*10;
    this.hue = 260 + Math.random()*80;
  }

  update(){
    this.t++;

    if(this.t < this.delay) return;

    if(this.h < this.maxH){
      this.h += 2;
    }else{
      if(this.bloom < this.size){
        this.bloom += 0.4;
      }
    }

    this.draw();
  }

  draw(){
    let top = H - this.h;

    // sap
    ctx.strokeStyle="#6cff63";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(this.x,H);
    ctx.lineTo(this.x,top);
    ctx.stroke();

    // çiçek
    if(this.h >= this.maxH){
      for(let i=0;i<8;i++){
        let a = i*Math.PI/4;
        let px = this.x + Math.cos(a)*this.bloom;
        let py = top + Math.sin(a)*this.bloom;

        ctx.fillStyle=`hsl(${this.hue},100%,60%)`;
        ctx.beginPath();
        ctx.arc(px,py,this.bloom/2,0,Math.PI*2);
        ctx.fill();
      }

      ctx.fillStyle="#ffd166";
      ctx.beginPath();
      ctx.arc(this.x,top,this.bloom/3,0,Math.PI*2);
      ctx.fill();
    }
  }
}

/* çiçekler aralıklı (çakışma yok) */
let flowers = [];
let gap = W / 10;

for(let i=1;i<9;i++){
  flowers.push(new Flower(i*gap, i*20));
}

/* animasyon */
function draw(){
  ctx.clearRect(0,0,W,H);

  // yıldızlar
  ctx.fillStyle="white";
  stars.forEach(s=>{
    ctx.fillRect(s.x,s.y,s.s,s.s);
    s.y += 0.3;
    if(s.y > H) s.y = 0;
  });

  // çiçekler
  flowers.forEach(f=>f.update());

  requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
