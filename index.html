<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sana Özel</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  height:100vh;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:radial-gradient(circle at top,#421127,#09030a 65%);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
}

.scene{
  width:100%;
  height:100vh;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
}

.stars span{
  position:absolute;
  width:4px;
  height:4px;
  background:white;
  border-radius:50%;
  animation:fall 6s linear infinite;
  opacity:.8;
}

@keyframes fall{
  from{transform:translateY(-100px);opacity:1}
  to{transform:translateY(110vh);opacity:0}
}

.title{
  font-size:42px;
  font-weight:900;
  margin-bottom:18px;
  background:linear-gradient(135deg,#ff4f93,#ffd6e4);
  -webkit-background-clip:text;
  color:transparent;
  animation:fadeUp 1.2s ease forwards;
}

.subtitle{
  max-width:520px;
  color:#ffdce8;
  font-size:18px;
  line-height:1.7;
  margin-bottom:35px;
  animation:fadeUp 1.6s ease forwards;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(35px)}
  to{opacity:1;transform:translateY(0)}
}

.rose-wrap{
  position:relative;
  width:300px;
  height:420px;
  perspective:1000px;
  animation:fadeUp 2s ease forwards;
}

.rose{
  position:absolute;
  inset:0;
  transform-style:preserve-3d;
  animation:spin 7s ease-in-out infinite;
}

@keyframes spin{
  0%,100%{transform:rotateY(-25deg) translateY(0)}
  50%{transform:rotateY(25deg) translateY(-22px)}
}

.glow{
  position:absolute;
  width:310px;
  height:310px;
  top:20px;
  left:-5px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,79,147,.65),transparent 70%);
  filter:blur(18px);
}

.stem{
  position:absolute;
  width:13px;
  height:260px;
  top:150px;
  left:144px;
  border-radius:999px;
  background:linear-gradient(#67ff9e,#087a3b);
  box-shadow:0 0 25px rgba(103,255,158,.35);
}

.leaf{
  position:absolute;
  width:95px;
  height:45px;
  top:255px;
  left:150px;
  background:linear-gradient(135deg,#67ff9e,#087a3b);
  border-radius:100% 0 100% 0;
  transform:rotate(-28deg);
}

.leaf.two{
  top:305px;
  left:60px;
  transform:rotate(210deg);
}

.petal{
  position:absolute;
  width:125px;
  height:150px;
  top:50px;
  left:87px;
  border-radius:80% 80% 45% 45%;
  transform-origin:bottom center;
  background:linear-gradient(135deg,#ff1f78,#ffadc9);
  box-shadow:inset 0 0 30px rgba(255,255,255,.28),0 22px 45px rgba(255,63,142,.35);
}

.p1{transform:rotate(0deg) translateZ(60px)}
.p2{transform:rotate(45deg) translateZ(52px)}
.p3{transform:rotate(90deg) translateZ(45px)}
.p4{transform:rotate(135deg) translateZ(52px)}
.p5{transform:rotate(180deg) translateZ(60px)}
.p6{transform:rotate(225deg) translateZ(52px)}
.p7{transform:rotate(270deg) translateZ(45px)}
.p8{transform:rotate(315deg) translateZ(52px)}

.core{
  position:absolute;
  width:95px;
  height:95px;
  top:96px;
  left:102px;
  border-radius:50%;
  background:radial-gradient(circle,#ffe1ec,#ff1f78 72%);
  box-shadow:0 0 60px rgba(255,63,142,.9);
}

.message{
  margin-top:25px;
  padding:18px 22px;
  border-radius:24px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(14px);
  max-width:520px;
  color:#ffdce8;
  line-height:1.7;
  animation:fadeUp 2.4s ease forwards;
}

.name{
  color:#ff8fb3;
  font-size:25px;
  font-weight:900;
}

.hearts span{
  position:absolute;
  bottom:-40px;
  color:#ff6fa8;
  font-size:24px;
  animation:heartUp 7s linear infinite;
}

@keyframes heartUp{
  from{transform:translateY(0) scale(.8);opacity:0}
  20%{opacity:1}
  to{transform:translateY(-110vh) scale(1.4);opacity:0}
}

.btn{
  margin-top:24px;
  display:inline-block;
  padding:15px 28px;
  border-radius:999px;
  background:linear-gradient(135deg,#ff4f93,#ffd1dc);
  color:#190713;
  text-decoration:none;
  font-weight:900;
  box-shadow:0 18px 45px rgba(255,79,147,.32);
  animation:fadeUp 2.8s ease forwards;
}

@media(max-width:600px){
  .title{font-size:32px}
  .subtitle{font-size:16px}
  .rose-wrap{transform:scale(.82)}
}
</style>
</head>

<body>

<div class="scene">
  <div class="stars" id="stars"></div>
  <div class="hearts" id="hearts"></div>

  <h1 class="title">Sevgiline Özel Dijital Hediye</h1>
  <p class="subtitle">QR okutulduğunda açılan romantik 3D gül animasyonu ve kişiye özel mesaj sayfası</p>

  <div class="rose-wrap">
    <div class="rose">
      <div class="glow"></div>
      <div class="stem"></div>
      <div class="leaf"></div>
      <div class="leaf two"></div>
      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p4"></div>
      <div class="petal p5"></div>
      <div class="petal p6"></div>
      <div class="petal p7"></div>
      <div class="petal p8"></div>
      <div class="core"></div>
    </div>
  </div>

  <div class="message">
    <div class="name">Saide için</div>
    Sen benim en güzel tesadüfüm en özel hikayemsin  
    iyi ki varsın iyi ki benimlesin
    <br><br>
    <b>09 10 2024</b>
  </div>

  <a class="btn" href="https://wa.me/905XXXXXXXXX">Bana Özel Tasarla</a>
</div>

<script>
const stars = document.getElementById("stars");
for(let i=0;i<55;i++){
  const s=document.createElement("span");
  s.style.left=Math.random()*100+"%";
  s.style.animationDelay=Math.random()*6+"s";
  s.style.animationDuration=4+Math.random()*5+"s";
  stars.appendChild(s);
}

const hearts = document.getElementById("hearts");
for(let i=0;i<22;i++){
  const h=document.createElement("span");
  h.innerHTML="♥";
  h.style.left=Math.random()*100+"%";
  h.style.animationDelay=Math.random()*7+"s";
  h.style.animationDuration=5+Math.random()*5+"s";
  hearts.appendChild(h);
}
</script>

</body>
</html>
